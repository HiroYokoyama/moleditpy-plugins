name: API checker engine
on:
  push:
    branches: [main]
    paths: ['api-checker/**', 'tests_api_checker/**', '.github/workflows/test-api-checker.yml']
  pull_request:
    paths: ['api-checker/**', 'tests_api_checker/**', '.github/workflows/test-api-checker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install pytest ruff
      - run: ruff check --isolated --select E4,E7,E9,F,I api-checker/plugin_api_checker.py api-checker/check_api.py tests_api_checker
      - run: ruff format --check api-checker/plugin_api_checker.py api-checker/check_api.py tests_api_checker
      - run: python -m pytest tests_api_checker -q
