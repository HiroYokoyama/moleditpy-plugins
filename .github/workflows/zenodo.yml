name: Zenodo Production Upload

on:
  # Manual backfill and re-runs only. Normal archiving happens in the
  # zenodo-upload job of release.yml, which a tag push drives end to end;
  # a `release: published` trigger here as well would be a second path to the
  # same action. Re-running is safe regardless: update_zenodo.py refuses a
  # version identical to the record's current one, so a repeat cannot mint a
  # duplicate DOI.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload (e.g. 2026.07.24). If left empty, the latest release will be used."
        required: false
        type: string
      deposition_id:
        description: "Override the Zenodo record ID (defaults to DEPOSITION_ID in scripts/update_zenodo.py)."
        required: false
        type: string
      isolated_draft_test:
        description: "Validate saving in a separate unpublished test draft (requires draft=true)."
        required: false
        type: boolean
        default: false
      draft_id:
        description: "Existing draft ID to resume without creating a new version (optional)."
        required: false
        type: string
      draft:
        description: "Keep as a draft (do not publish)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  zenodo-upload:
    runs-on: ubuntu-latest
    # A pre-release is not the thing to mint a permanent DOI for.
    if: github.event_name != 'release' || github.event.release.prerelease == false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              echo "No tag specified, fetching latest release tag..."
              TAG=$(gh release view --json tagName --template '{{.tagName}}')
            fi
          fi
          echo "Processing tag: $TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

          # Include the same ZIP assets as the tag release workflow.
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name | select(endswith(".zip"))')
          while IFS= read -r asset; do
            [ -z "$asset" ] || gh release download "$TAG" --pattern "$asset" --dir dist
          done <<< "$ASSETS"

          # The source archive is always available for a tag.
          curl --fail --location --retry 3 -o "dist/source.tar.gz" "https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"

          echo "Downloaded assets:"
          ls -la dist/

      - name: Upload and Publish to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          RESUME_DRAFT_ID: ${{ inputs.draft_id }}
          ISOLATED_DRAFT_TEST: ${{ inputs.isolated_draft_test }}
          KEEP_DRAFT: ${{ inputs.draft }}
        run: |
          DEP_ARG=""
          if [ -n "${{ github.event.inputs.deposition_id }}" ]; then
            DEP_ARG="--deposition-id ${{ github.event.inputs.deposition_id }}"
          fi

          PUBLISH_ARG="--publish"
          if [ "${{ github.event.inputs.draft }}" = "true" ]; then
            PUBLISH_ARG=""
          fi

          DRAFT_ARG=()
          if [ "$ISOLATED_DRAFT_TEST" = "true" ]; then
            [ "$KEEP_DRAFT" = "true" ] || exit 1
            [ -z "$RESUME_DRAFT_ID" ] || exit 1
            DRAFT_ARG=(--isolated-draft-test)
          fi
          if [ -n "$RESUME_DRAFT_ID" ]; then
            [[ "$RESUME_DRAFT_ID" =~ ^[0-9]+$ ]] || exit 1
            DRAFT_ARG=(--draft-id "$RESUME_DRAFT_ID")
          fi
          python scripts/update_zenodo.py $PUBLISH_ARG $DEP_ARG "${DRAFT_ARG[@]}" --version-string "$TAG" dist/*
