name: Release

# Releases here mark a snapshot of the whole collection rather than one
# plugin's version, so the tag is a date: v2026.08.01. The pattern below is
# deliberately strict — a stray tag should not publish a release.
on:
  push:
    tags:
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]"
  workflow_dispatch:
    inputs:
      zenodo:
        description: 'Upload and publish to Zenodo after the release'
        required: false
        type: boolean
        default: true
      tag:
        description: "Existing tag to publish a release for (e.g. v2026.08.01)."
        required: true
        type: string

permissions:
  contents: write
  pages: write

concurrency:
  group: collection-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$INPUT_TAG"
          fi
          [[ "$TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]] || exit 1
          echo "Tag: $TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Verify the tag exists
        run: |
          # A dispatch can name anything; releasing a tag that is not in the
          # repository would create a release pointing at the default branch.
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag '${TAG}' does not exist in this repository."
            exit 1
          fi
          git checkout --detach "refs/tags/$TAG"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ZIP assets from the tag
        run: |
          python scripts/package_intra_repo_plugins.py \
            --output-dir "$RUNNER_TEMP/plugin-packages" \
            --manifest "$RUNNER_TEMP/plugin-packages/manifest.json"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            TITLE="Up to the release of ${TAG#v}"
            gh release create "$TAG" --verify-tag --title "$TITLE" --notes "$TITLE"
          fi
          # Deterministic output makes retries produce the same bytes.
          gh release upload "$TAG" "$RUNNER_TEMP/plugin-packages/"*.zip --clobber

      - name: Check out current main for the registry update
        uses: actions/checkout@v6
        with:
          ref: main
          path: registry-main

      - name: Publish ZIP URLs and checksums to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C registry-main config user.name "github-actions[bot]"
          git -C registry-main config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            python scripts/update_release_packages.py \
              --registry registry-main/REGISTRY/plugins.json \
              --manifest "$RUNNER_TEMP/plugin-packages/manifest.json" \
              --repository "$GITHUB_REPOSITORY" --tag "$TAG"
            python registry-main/scripts/validate_json.py registry-main/REGISTRY/plugins.json
            git -C registry-main add REGISTRY/plugins.json
            if git -C registry-main diff --cached --quiet; then
              break
            fi
            git -C registry-main commit -m "Publish collection ZIP assets: $TAG" -m "Assisted-by: GPT-6.1 Sol"
            if git -C registry-main push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            git -C registry-main fetch origin main
            git -C registry-main reset --hard origin/main
          done
          # Token-authored pushes do not start a legacy Pages build.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

  # Archiving runs here rather than from zenodo.yml's `release: published`
  # trigger: this workflow mints the release with GITHUB_TOKEN, and GitHub does
  # not raise workflow-triggering events for token-authored actions, so that
  # trigger never fires. Same shape as the main app's release.yml.
  zenodo-upload:
    # A tag push always archives; a manual dispatch can opt out.
    if: ${{ github.event_name == 'push' || inputs.zenodo }}
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Archiving tag: $TAG"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --pattern "*.zip" --dir dist --skip-existing || true
          curl -L -o "dist/source.tar.gz" \
            "https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          ls -la dist/

      - name: Upload and Publish to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "ERROR: ZENODO_TOKEN is not set, so $TAG was released but not archived." >&2
            exit 1
          fi
          # --deposition-id is omitted on purpose: DEPOSITION_ID in the script
          # is the single source of truth for which record family to version.
          python scripts/update_zenodo.py \
            --publish \
            --version-string "$TAG" \
            dist/*
